name: Release

# Fires on semver tag pushes (v1.2.3, v1.2.3-rc.1, ...). Generates a changelog
# from conventional commits since the previous tag and publishes a GitHub
# Release. Nothing here creates tags — that's a manual `git tag vX.Y.Z && git
# push --tags` step outside this workflow.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need full history to diff against the previous tag

      - name: Generate changelog
        id: changelog
        shell: bash
        run: .github/scripts/generate-changelog.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
