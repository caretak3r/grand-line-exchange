name: Deploy to GitHub Pages

# Unified Pages deploy: GitHub Pages serves ONE artifact per repo, so the
# dashboard (site root) and the docs site (/docs) are built here together
# and merged into a single artifact. There must be no other workflow that
# deploys to Pages — a second deploy would clobber this one.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'docs-site/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ['Update Prices']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          check-latest: true
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
      - run: npm ci
      - name: Build dashboard
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Install docs dependencies
        run: npm ci
        working-directory: docs-site
      - name: Build docs site
        run: npm run build
        working-directory: docs-site
        env:
          BASE_PATH: /grand-line-exchange/docs
      - name: Stage merged Pages artifact
        run: |
          mkdir site
          cp -r dist/* site/
          cp -r docs-site/out site/docs
      - name: Verify merged artifact
        run: |
          test -f site/index.html
          test -f site/docs/index.html
          test -d site/data
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
